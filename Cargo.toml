[workspace]
resolver = "2"
members = ["lazymongo-core", "lazymongo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/beast-industries/lazymongo"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
mongodb = "3"
bson = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
